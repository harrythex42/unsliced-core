name: Build and Test

on:
  push:
    branches: [ "main", "master", "release-prep" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UNSLICED_PYTHON: python

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set a new browser cache for this job
      shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/unsliced-first-chromium" >> "$GITHUB_ENV"

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Type check
      run: pnpm typecheck

    - name: Run unit tests
      run: pnpm test:unit

    - name: Set up Python for PDF text verification
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install PDF inspection tools
      run: python -m pip install -r scripts/requirements.txt

    - name: Install Chromium
      run: pnpm exec playwright install --with-deps chromium

    - name: Run browser tests
      run: pnpm test:browser

    - name: Run sample acceptance checks
      run: pnpm acceptance
